<!-- ============ HERO ============ -->
<section class="hero-section">
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      {% for banner in banners %}
      <div class="swiper-slide">
        <div class="slide-bg" style="background-image:url('{{ banner.image_url }}');"></div>
        <div class="slide-overlay"></div>
        <div class="container h-100 d-flex align-items-center">
          <div class="slider-content">
            <h1 class="hero-title">{{ banner.title }}</h1>
            {% if banner.subtitle %}
              <p class="hero-lead">{{ banner.subtitle }}</p>
            {% elif banner.description %}
              <p class="hero-lead">{{ banner.description|truncatewords:20 }}</p>
            {% endif %}
            <a href="#packages" class="btn-sunrise">Explore Packages <i class="bi bi-arrow-right"></i></a>
          </div>
        </div>
      </div>
      {% endfor %}      
    </div>
    <div class="swiper-pagination"></div>
  </div>
</section>
