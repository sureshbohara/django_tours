{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="description" content="EZ Tours Admin Dashboard">
    <link rel="icon" href="{% static 'asset/images/favicon.png' %}">
    <title>{% block title %} Admin Dashboard {% endblock %} - EZ Tours</title>

    <!-- Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <!-- Plugin Styles -->
    <link href="{% static 'asset/plugins/simplebar/css/simplebar.css' %}" rel="stylesheet">
    <link href="{% static 'asset/plugins/perfect-scrollbar/css/perfect-scrollbar.css' %}" rel="stylesheet">
    <link href="{% static 'asset/plugins/metismenu/css/metisMenu.min.css' %}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-toggle@2.2.2/css/bootstrap-toggle.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link href="{% static 'asset/css/style.css' %}" rel="stylesheet">
    <link href="{% static 'asset/css/icons.css' %}" rel="stylesheet">
    <link href="{% static 'asset/css/custom.css' %}" rel="stylesheet">
    <link href="{% static 'asset/css/dark-theme.css' %}" rel="stylesheet">
   
</head>

<body>
    <div class="wrapper">
        {% include 'includes/admin/header.html' %}
        {% include 'includes/admin/sidebar.html' %}

        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'asset/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'asset/plugins/simplebar/js/simplebar.min.js' %}"></script>
    <script src="{% static 'asset/plugins/metismenu/js/metisMenu.min.js' %}"></script>
    <script src="{% static 'asset/plugins/peity/jquery.peity.min.js' %}"></script>
    <script src="{% static 'asset/plugins/perfect-scrollbar/js/perfect-scrollbar.js' %}"></script>
    <script src="{% static 'asset/js/app.js' %}"></script>
     <script src="{% static 'asset/js/admin-crud.js' %}"></script>
    
    <!-- CDN Plugins -->
    <script src="https://gitcdn.github.io/bootstrap-toggle/2.2.2/js/bootstrap-toggle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Dark Mode Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const darkModeButton = document.getElementById('darkModeButton');
            const moonIcon = document.getElementById('moonIcon');
            const userName = document.querySelector('#darkModeButton .user-name'); 
            let darkMode = localStorage.getItem('darkMode') === 'enabled';
            
            function updateTheme(isDark) {
                if (moonIcon) {
                    moonIcon.src = isDark ? "{% static 'asset/images/moon_dark.png' %}" : "{% static 'asset/images/moon_light.png' %}";
                }
                document.documentElement.classList.toggle('dark-theme', isDark);
                if (userName) {
                    userName.textContent = isDark ? 'Dark' : 'Light';
                }
            }
            updateTheme(darkMode);
            darkModeButton?.addEventListener('click', function () {
                darkMode = !darkMode;
                localStorage.setItem('darkMode', darkMode ? 'enabled' : 'disabled');
                updateTheme(darkMode);
            });
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
