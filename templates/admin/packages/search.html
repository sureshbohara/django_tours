<div class="col-12">
    <form id="filterForm" method="GET" class="row g-3 mb-3">
        <div class="col-md-4">
            <input type="text" name="search" class="form-control form-control-sm" placeholder="🔍 Search by package name..." value="{{ filters.search|default:'' }}">
        </div>
        <div class="col-md-3">
            <select name="status" class="form-select form-select-sm">
                <option value="">All Status</option>
                <option value="1" {% if filters.status == '1' %}selected{% endif %}>✅ Active</option>
                <option value="0" {% if filters.status == '0' %}selected{% endif %}>❌ Inactive</option>
            </select>
        </div>
        <div class="col-md-3">
            <select name="display_on" class="form-select form-select-sm">
                <option value="">All Display</option>
                <option value="default" {% if filters.display_on == 'default' %}selected{% endif %}>Default</option>
                <option value="recommended" {% if filters.display_on == 'recommended' %}selected{% endif %}>⭐ Recommended</option>
                <option value="popular" {% if filters.display_on == 'popular' %}selected{% endif %}>🔥 Popular</option>
                <option value="upcoming" {% if filters.display_on == 'upcoming' %}selected{% endif %}> Upcoming</option>
            </select>
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-success btn-sm text-white">🔍 Filter</button>
            <a href="{% url 'packages:package_list' %}" class="btn btn-primary btn-sm text-white">✕ Reset</a>
        </div>
    </form>
</div>
